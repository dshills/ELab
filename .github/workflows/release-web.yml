name: Qualify web alpha

on:
  workflow_dispatch:
    inputs:
      version:
        description: Alpha version (for example 0.207.0-alpha.1)
        required: true
        type: string
      build:
        description: Numeric macOS build number
        required: true
        type: string
      publish:
        description: Create draft, verify GitHub downloads, then publish prerelease
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: web-alpha-release
  cancel-in-progress: false

jobs:
  qualify:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      GOCACHE: ${{ github.workspace }}/build/go-cache
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_BUILD: ${{ inputs.build }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.27.3'
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Install locked browser test dependencies
        run: npm ci --prefix browser --ignore-scripts --no-audit --no-fund
      - name: Install browser engines
        working-directory: browser
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Qualify exact source, browser workflows and archived shipping binary
        run: python3 -B scripts/release_web.py stage --version "$RELEASE_VERSION" --build "$RELEASE_BUILD" --output build/release-alpha
      - name: Verify GitHub downloads and publish requested alpha
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B scripts/release_web.py publish --directory build/release-alpha --make-public
      # Never upload the entire stage: runtime startup replies contain control credentials.
      - name: Retain distribution and credential-free evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-alpha-candidate
          if-no-files-found: warn
          retention-days: 14
          path: |
            build/release-alpha/*.zip
            build/release-alpha/release.json
            build/release-alpha/SHA256SUMS
            build/release-alpha/RELEASE-NOTES.md
            build/release-alpha/browsers.json
            build/release-alpha/qualification/*.json
            build/release-alpha/quality/report.json
            build/release-alpha/quality/*.log
