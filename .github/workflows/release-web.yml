name: Qualify web alpha

on:
  workflow_dispatch:
    inputs:
      version:
        description: Alpha version (for example 0.209.0-alpha.1)
        required: true
        type: string
      build:
        description: Positive numeric release build
        required: true
        type: string
      publish:
        description: Create draft, verify GitHub downloads, then publish prerelease
        default: false
        type: boolean
      macos_launcher:
        description: Also stage the optional Apple Silicon launcher as a workflow artifact
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: web-alpha-release
  cancel-in-progress: false

env:
  RELEASE_VERSION: ${{ inputs.version }}
  RELEASE_BUILD: ${{ inputs.build }}
  # Verify exact source bytes on Windows too.
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: core.autocrlf
  GIT_CONFIG_VALUE_0: 'false'

jobs:
  stage:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GOCACHE: ${{ github.workspace }}/build/go-cache
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Check dispatched revision
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.27.3'
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Install locked browser test dependencies
        run: npm ci --prefix browser --ignore-scripts --no-audit --no-fund
      - name: Install browser engines
        working-directory: browser
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Build standalone downloads and qualify the exact shipping web host in browsers
        run: python3 -B scripts/release_web.py stage --version "$RELEASE_VERSION" --build "$RELEASE_BUILD" --output build/release-alpha
      - name: Retain standalone downloads and qualification receipts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-alpha-candidate
          if-no-files-found: error
          retention-days: 14
          path: |
            build/release-alpha/*.zip
            build/release-alpha/release.json
            build/release-alpha/SHA256SUMS
            build/release-alpha/RELEASE-NOTES.md
            build/release-alpha/browsers.json
            build/release-alpha/qualification/*.json
      - name: Retain gate diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-alpha-gates
          if-no-files-found: warn
          retention-days: 14
          path: |
            build/release-alpha/browsers.json
            build/release-alpha/quality/report.json
            build/release-alpha/quality/*.log

  runtime:
    needs: stage
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-26
          - target: darwin-amd64
            runner: macos-15-intel
          - target: windows-amd64
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: web-alpha-candidate
          path: build/release-alpha
      - name: Exercise the extracted shipping download
        run: python -B scripts/release_web.py verify-runtime --directory build/release-alpha --target ${{ matrix.target }} --report build/runtime-${{ matrix.target }}.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-alpha-runtime-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 14
          path: build/runtime-${{ matrix.target }}.json

  publish:
    if: inputs.publish
    needs: [stage, runtime]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: web-alpha-candidate
          path: build/release-alpha
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: web-alpha-runtime-*
          path: build/release-alpha/qualification
          merge-multiple: true
      - name: Verify GitHub downloads and publish requested alpha
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B scripts/release_web.py publish --directory build/release-alpha --make-public

  optional-macos-launcher:
    if: github.ref == 'refs/heads/main' && inputs.macos_launcher
    runs-on: macos-26
    timeout-minutes: 30
    env:
      GOCACHE: ${{ github.workspace }}/build/go-cache
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.27.3'
          cache-dependency-path: go.sum
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Build and check the optional launcher
        run: |
          archive="build/launcher/ELab-Web-$RELEASE_VERSION-macos-arm64-launcher.zip"
          python3 -B scripts/package_web.py --output 'build/launcher/ELab Web.app' --version "$RELEASE_VERSION" --build-version "$RELEASE_BUILD" --archive "$archive"
          /usr/bin/ditto -x -k "$archive" build/launcher/extracted
          python3 -B scripts/qualify_web_package.py --app 'build/launcher/extracted/ELab Web.app' --artifacts build/launcher/runtime
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: optional-macos-launcher
          if-no-files-found: error
          retention-days: 14
          path: |
            build/launcher/*.zip
            build/launcher/ELab Web.package.json
            build/launcher/runtime/qualification.json
