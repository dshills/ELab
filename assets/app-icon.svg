<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>ELab application icon</title>
  <desc>A luminous E-shaped circuit and amber LED on an inset blue instrument tile.</desc>
  <defs>
    <linearGradient id="tile" x1="170" y1="90" x2="830" y2="940" gradientUnits="userSpaceOnUse">
      <stop stop-color="#218bc8"/>
      <stop offset=".48" stop-color="#08648e"/>
      <stop offset="1" stop-color="#062d50"/>
    </linearGradient>
    <linearGradient id="trace" x1="310" y1="280" x2="720" y2="760" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f1feff"/>
      <stop offset="1" stop-color="#7de5f2"/>
    </linearGradient>
    <radialGradient id="led">
      <stop stop-color="#fff4b8"/>
      <stop offset=".6" stop-color="#ffd36d"/>
      <stop offset="1" stop-color="#f4a638"/>
    </radialGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="160%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>
  <rect x="80" y="94" width="864" height="864" rx="194" fill="#00152d" opacity=".26" filter="url(#shadow)"/>
  <rect x="80" y="80" width="864" height="864" rx="194" fill="url(#tile)"/>
  <rect x="83" y="83" width="858" height="858" rx="191" fill="none" stroke="#a1e4ff" stroke-opacity=".3" stroke-width="3"/>
  <g fill="none" stroke="#8ee4f5" stroke-opacity=".1" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M152 622h60V232h172M872 398h-76V174M870 796h-90v60H420M180 806h98"/>
    <circle cx="384" cy="232" r="10"/>
    <circle cx="796" cy="174" r="10"/>
    <circle cx="420" cy="856" r="10"/>
  </g>
  <g fill="none" stroke="url(#trace)" stroke-width="46" stroke-linecap="round" stroke-linejoin="round">
    <path d="M664 304H326v416h380"/>
    <path d="M326 512h96l24-42 40 84 40-84 40 84 24-42h116"/>
  </g>
  <g fill="#c2f5fc">
    <circle cx="326" cy="512" r="31"/>
    <circle cx="706" cy="512" r="32"/>
    <circle cx="706" cy="720" r="32"/>
  </g>
  <circle cx="706" cy="304" r="72" fill="#ffce64" opacity=".36" filter="url(#glow)"/>
  <circle cx="706" cy="304" r="57" fill="#083f63" stroke="#ffe7a2" stroke-width="7"/>
  <circle cx="706" cy="304" r="43" fill="url(#led)"/>
  <ellipse cx="694" cy="291" rx="16" ry="11" fill="#fffbe1" opacity=".75"/>
